site_name: Productive K3S CLI
site_description: Unified command-line interface for the Productive K3S ecosystem, with bilingual documentation.
site_author: Productive K3S CLI
site_url: https://cli.productive-k3s.io/
repo_url: https://github.com/jemacchi/productive-k3s-cli
repo_name: GitHub
edit_uri: edit/main/docs/src/
docs_dir: src
site_dir: site

theme:
  name: material
  custom_dir: src/overrides
  language: en
  favicon: assets/images/favicon.ico
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.path
    - navigation.sections
    - navigation.expand
    - navigation.footer
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: white
      accent: blue
  font: false
  icon:
    repo: fontawesome/brands/github

extra_css:
  - assets/stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: On this page
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search

nav:
  - Home: index.md
  - English:
      - Home: en/index.md
      - Product:
          - en/product/index.md
          - How to use: en/product/how-to-use.md
          - Reasons behind: en/product/reasons-behind.md
          - Relationship with Productive K3S Core and Infra: en/product/productive-k3s-relationship.md
      - User docs:
          - en/user-docs/index.md
          - Installation: en/user-docs/installation.md
          - Usage: en/user-docs/usage.md
          - Profiles: en/user-docs/profiles.md
          - Troubleshooting: en/user-docs/troubleshooting.md
      - Developer docs:
          - en/developer-docs/index.md
          - Make targets: en/developer-docs/make-targets.md
          - GitHub Actions and releases: en/developer-docs/github-actions.md
          - Architecture: en/developer-docs/architecture/index.md
          - CLI: en/developer-docs/cli/index.md
          - Bundles: en/developer-docs/bundles/index.md
          - Profiles: en/developer-docs/profiles/index.md
          - Development: en/developer-docs/development/index.md
          - Addons: en/developer-docs/addons/index.md
          - Decisions: en/developer-docs/decisions/index.md
          - Specifications:
              - en/developer-docs/specifications/index.md
              - CLI specification: en/developer-docs/specifications/cli-specification.md
          - Testing: en/developer-docs/testing/index.md
          - Roadmap: en/developer-docs/roadmap/index.md
          - Guides:
              - en/developer-docs/guides/index.md
              - CLI scope and responsibilities: en/developer-docs/guides/cli-scope.md
              - Project layout: en/developer-docs/guides/project-layout.md
              - Bundle contract: en/developer-docs/guides/bundle-contract.md
              - Core interface mapping: en/developer-docs/guides/core-interface.md
              - Infra interface mapping: en/developer-docs/guides/infra-interface.md
              - Versioning model: en/developer-docs/guides/versioning.md
              - Documentation workflow: en/developer-docs/guides/documentation-workflow.md
              - Live remote validation: en/developer-docs/guides/live-validation.md
  - Español:
      - Inicio: es/index.md
      - Producto:
          - es/product/index.md
          - Cómo usar: es/product/how-to-use.md
          - Razones del diseño: es/product/reasons-behind.md
          - Relación con Productive K3S Core e Infra: es/product/productive-k3s-relationship.md
      - Documentación para usuarios:
          - es/user-docs/index.md
          - Instalación: es/user-docs/installation.md
          - Uso: es/user-docs/usage.md
          - Perfiles: es/user-docs/profiles.md
          - Troubleshooting: es/user-docs/troubleshooting.md
      - Documentación para desarrolladores:
          - es/developer-docs/index.md
          - Targets de Make: es/developer-docs/make-targets.md
          - GitHub Actions y releases: es/developer-docs/github-actions.md
          - Guías:
              - es/developer-docs/guides/index.md
              - Alcance y responsabilidades del CLI: es/developer-docs/guides/cli-scope.md
              - Organización del proyecto: es/developer-docs/guides/project-layout.md
              - Contrato de bundles: es/developer-docs/guides/bundle-contract.md
              - Mapeo de interfaz Core: es/developer-docs/guides/core-interface.md
              - Mapeo de interfaz Infra: es/developer-docs/guides/infra-interface.md
              - Modelo de versionado: es/developer-docs/guides/versioning.md
              - Flujo de documentación: es/developer-docs/guides/documentation-workflow.md
              - Validación remota live: es/developer-docs/guides/live-validation.md

extra:
  pk3s:
    footer_slogan_en: "A single command surface to operate Productive K3S Core, Infra, and ecosystem bundles with one consistent workflow."
    footer_slogan_es: "Una sola superficie de comandos para operar Productive K3S Core, Infra y los bundles del ecosistema con un flujo consistente."
    contact_label_en: "Contact"
    contact_label_es: "Contacto"
    newsletter_label_en: "Newsletter"
    newsletter_label_es: "Newsletter"
    newsletter_placeholder_en: "E-mail"
    newsletter_placeholder_es: "E-mail"
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/jemacchi/productive-k3s-cli
