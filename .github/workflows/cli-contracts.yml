
name: PR Validation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quick-checks:
    name: Quick Checks
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout productive-k3s-cli
        uses: actions/checkout@v4
        with:
          path: productive-k3s-cli
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: productive-k3s-cli/go.mod

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install shell helper tooling
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"

          curl -fsSLO https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          tar -xJf shellcheck-v0.11.0.linux.x86_64.tar.xz
          install shellcheck-v0.11.0/shellcheck "$HOME/.local/bin/shellcheck"

          curl -fsSLo "$HOME/.local/bin/shfmt" https://github.com/mvdan/sh/releases/download/v3.13.1/shfmt_v3.13.1_linux_amd64
          chmod +x "$HOME/.local/bin/shfmt"

          python3 -m pip install --user codespell
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run quick checks
        working-directory: productive-k3s-cli
        shell: bash
        run: |
          set -euo pipefail
          make test-unit
          make test-lint
          make test-format
          make test-spell

  static-and-contract:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false }}
    needs:
      - quick-checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout productive-k3s-cli
        uses: actions/checkout@v4
        with:
          path: productive-k3s-cli
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: productive-k3s-cli/go.mod

      - name: Run Go tests
        working-directory: productive-k3s-cli
        shell: bash
        run: make go-test

      - name: Run CLI contract tests
        working-directory: productive-k3s-cli
        shell: bash
        run: make test-cli-contract

      - name: Upload CLI contract artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: productive-k3s-cli-contract-artifacts
          path: |
            productive-k3s-cli/test-artifacts
          if-no-files-found: ignore

  live-onprem-remote-github-host:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false }}
    needs:
      - quick-checks
      - static-and-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout productive-k3s-cli
        uses: actions/checkout@v4
        with:
          path: productive-k3s-cli
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: productive-k3s-cli/go.mod

      - name: Run GitHub-host on-prem remote live test
        working-directory: productive-k3s-cli
        shell: bash
        env:
          TELEMETRY_ENABLED: "false"
        run: make test-live-gha-onprem-remote

      - name: Upload live artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: productive-k3s-cli-live-onprem-remote-github-host-artifacts
          path: |
            productive-k3s-cli/test-artifacts
          if-no-files-found: ignore
